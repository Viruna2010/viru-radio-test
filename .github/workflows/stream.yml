name: Viru Radio 6H Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # පැය 6යි

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install FFmpeg & High Quality Sinhala Font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          # Text Shaping එක්ක ලස්සනටම වැඩ කරන Noto Sans Sinhala Bold Font එක ඩවුන්ලෝඩ් කරනවා
          wget "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssinhala/static/NotoSansSinhala-Bold.ttf" -O font.ttf

      - name: Run Viru Radio Stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: node index.js
